<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#5a1fa0;
  --ink:#fff;
  --glow:#ff5aa8;
  --shade:#600a6e;
  --script:"Great Vibes","Snell Roundhand","Apple Chancery","Segoe Script",cursive;
  --round:"Pacifico","Segoe Script","Marker Felt","Comic Sans MS",cursive;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#3a1478; } }
:root[data-theme="dark"]{ --bg:#3a1478; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  overflow:hidden; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  touch-action:manipulation; animation:intro 1.4s ease-out both;
}
@keyframes intro{ from{ opacity:0 } to{ opacity:1 } }

#fx{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }

/* ---------------- tấm thiệp 3D ---------------- */
#stage{
  position:fixed; inset:0; z-index:2; display:grid; place-items:center;
  perspective:1800px; perspective-origin:50% 45%;
  transition:opacity .9s ease, transform .9s ease;
}
#stage.gone{ opacity:0; transform:scale(1.25); pointer-events:none; }
#tilt{ transform-style:preserve-3d; transition:transform .25s ease-out; animation:bob 3.2s ease-in-out infinite; }
#stage.opened #tilt{ animation:none; }
@keyframes bob{ 0%,100%{ translate:0 0 } 50%{ translate:0 -9px } }
#assembly{
  position:relative; width:var(--pw); height:var(--ph); transform-style:preserve-3d;
  transition:transform 2.4s cubic-bezier(.65,0,.25,1); font-size:var(--u);
}
.page,.face{ border-radius:calc(var(--pw) * .078); }
.page{
  position:absolute; inset:0; overflow:hidden;
  background:linear-gradient(#fffbfd,#ffe1ee);
  box-shadow:0 1.4em 2.6em rgba(50,0,60,.5);
}
.cover{
  position:absolute; inset:0; transform-style:preserve-3d;
  transition:transform 2.4s cubic-bezier(.65,0,.25,1);
}
.face{ position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.front{ background:linear-gradient(#ffecf4,#ffa6cb); box-shadow:0 1.4em 2.6em rgba(50,0,60,.5); }
.back{ background:linear-gradient(#fffbfd,#ffe4f0); }
.side .cover{ transform-origin:left center; }
.side .cover.open{ transform:rotateY(-180deg); }
.side .back{ transform:rotateY(180deg); }
.up .cover{ transform-origin:center top; }
.up .cover.open{ transform:rotateX(180deg); }
.up .back{ transform:rotateX(180deg); }
.notrans, .notrans .cover{ transition:none !important; }

.frame{ position:absolute; pointer-events:none; border-radius:calc(var(--pw) * .06); }
.f1{ inset:.75em; border:2px solid rgba(255,255,255,.95); }
.f2{ inset:1.2em; border:1px solid #f0be6e; border-radius:calc(var(--pw) * .05); }
.hsvg{ display:block; width:100%; height:auto; overflow:visible; }
.hero{ position:absolute; left:19%; right:19%; top:9%; filter:drop-shadow(0 .5em .7em rgba(150,10,70,.35)); }
.for{ position:absolute; left:0; right:0; top:60.5%; text-align:center; font:1.7em/1 var(--round); color:#c42670; }
.who{ position:absolute; left:0; right:0; top:68.5%; text-align:center; font:4.6em/1.2 var(--script); color:#c42670;
      text-shadow:0 .04em .06em rgba(150,20,80,.25); }
.spark{ position:absolute; width:1.1em; height:1.1em; fill:#fff; }
.mini{ position:absolute; width:1.3em; }
.inside{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#c42670; }
.inside .hb{ font:5.5em/.95 var(--script); text-shadow:0 .03em .05em rgba(150,20,80,.22); }
.inside .nm{ font:3.3em/1.2 var(--round); margin-top:.15em; text-shadow:0 .05em .07em rgba(150,20,80,.22); }
.inside .dt{ font:600 1.9em/1.3 var(--sans); color:#e29f46; letter-spacing:.24em; margin-top:.15em; }
.inside .row{ display:flex; gap:.5em; margin:.5em 0 .3em; }
.inside .row svg{ width:1.05em; height:auto; }
.inside .cm{ font:2.9em/1.15 var(--round); }
.inside .heartbox{ position:relative; width:11em; margin:.5em 0; }
.inside .heartbox b{ position:absolute; inset:0; display:grid; place-items:center; padding-bottom:.6em;
   font:400 3.7em/1 var(--round); color:#fff; text-shadow:0 .05em .1em rgba(150,10,70,.55); }
.inside .sn{ font:2.2em/1.2 var(--round); }
.dim{ position:absolute; inset:0; pointer-events:none; background:#3a0040; opacity:0; border-radius:inherit; }

#hint{
  position:fixed; left:0; right:0; z-index:3; text-align:center; pointer-events:none;
  font:500 17px/1.3 var(--sans); color:#fff; text-shadow:0 0 12px rgba(255,80,160,.9), 0 1px 3px rgba(60,0,60,.6);
  animation:pulse 2.2s ease-in-out infinite; transition:opacity .5s;
}
#hint.gone{ opacity:0; animation:none; }
@keyframes pulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }

/* ---------------- màn hình chúc mừng ---------------- */
#scene{ position:fixed; inset:0; z-index:3; pointer-events:none; }
.glowtxt{
  color:#fff; text-align:center;
  text-shadow:0 0 .1em var(--glow), 0 0 .28em var(--glow), 0 0 .6em var(--glow), 0 .05em .09em var(--shade);
}
#banner{

const stage = $('stage'), assembly = $('assembly'), cover = $('cover'), tilt = $('tilt');
const bannerEl = $('banner'), nameBox = $('nameBox'), wishBox = $('wishBox'), dotsEl = $('dots'), hintEl = $('hint');
let cardPW = 300, cardPH = 396, cardFit = 1, cardOpen = false;

function safeTop() { return parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0; }
function safeBottom() { return parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0; }

function layout() {
  // ---- thẻ thiệp ----
  const st = safeTop(), sb = safeBottom();
  const availH = H - st - sb;
  cardPW = Math.min(W * .74, availH * .58 / 1.318, 340);
  cardPH = cardPW * 1.318;
  stage.classList.toggle('up', vertical); stage.classList.toggle('side', !vertical);
  assembly.style.setProperty('--pw', cardPW + 'px');
  assembly.style.setProperty('--ph', cardPH + 'px');
  assembly.style.setProperty('--u', (cardPW / 22) + 'px');
  cardFit = vertical ? Math.min(1, (availH * .90) / (2 * cardPH), (W * .92) / cardPW)
                     : Math.min(1, (W * .92) / (2 * cardPW), (availH * .90) / cardPH);
  applyAssemblyTransform(false);
  hintEl.style.top = Math.round(H / 2 + st / 2 + cardPH / 2 + 26) + 'px';

  // ---- màn hình chúc mừng ----
  S = Math.min(W * .80 / 32, availH * .46 / 29);
  const bFont = Math.min(W * .145, availH * .14, 130);
  const wFont0 = Math.min(W * .056, availH * .04, 30);
  const contentH = bFont * 1.2 + 29 * S + 24 + wFont0 * 1.55 * 5;
  const off = clamp((availH - 100 - contentH) * .30, 0, 150);
  const bTop = st + Math.max(10, availH * .025) + off;
  bannerEl.style.fontSize = bFont + 'px'; bannerEl.style.top = bTop + 'px';
  const bBottom = bTop + bFont * 1.2;
  cy = bBottom + 14.5 * S + 8; cx = W / 2;
  const halfH = 14.5 * S;
  nameBox.style.top = (cy - 4) + 'px'; nameBox.style.fontSize = (S * 7.2) + 'px';
  nameBox.querySelector('.n2').style.fontSize = (S * 2.3 / (S * 7.2) ) + 'em';
  wishTop = cy + halfH + 16;
  const wFont = Math.min(W * .056, availH * .04, 30);
  wishBox.style.top = wishTop + 'px'; wishBox.style.fontSize = wFont + 'px';
  wishBox.style.height = Math.max(60, H - sb - wishTop - 92) + 'px';

  }
}
function applyAssemblyTransform(animate) {
  let tr;
  if (cardOpen) tr = vertical ? `translate(0px, ${cardPH * cardFit / 2}px) scale(${cardFit})`
                              : `translate(${cardPW * cardFit / 2}px, 0px) scale(${cardFit})`;
  else tr = 'translate(0px,0px) scale(1)';

/* ---------------------------------------------------------------------
   Nhạc hộp (giai điệu chúc mừng sinh nhật - tự tổng hợp bằng WebAudio)
   --------------------------------------------------------------------- */
const Music = {
  ac: null, master: null, on: true, timer: null, started: false,
  melody: [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
           [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
           [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
           [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]],
  init() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = .55;
    const dl = this.ac.createDelay(1); dl.delayTime.value = .27;
    const fb = this.ac.createGain(); fb.gain.value = .34;
    const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800;
    this.master.connect(this.ac.destination); this.master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(this.ac.destination);
  },
  tone(f, when, dur) {
    const ac = this.ac;
    [[1, .22, 1.7], [2.76, .07, .6], [4.1, .03, .35]].forEach(([m, g, d]) => {
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = 'sine'; o.frequency.value = f * m;
      v.gain.setValueAtTime(0, when); v.gain.linearRampToValueAtTime(g, when + .008);
      v.gain.exponentialRampToValueAtTime(.0008, when + dur * d + .2);
      o.connect(v); v.connect(this.master); o.start(when); o.stop(when + dur * d + .3);
    });
  },
  loop() {
    if (!this.ac || !this.on) return;
    const beat = .56; let t = this.ac.currentTime + .15;
    this.melody.forEach(([f, b]) => { this.tone(f, t, b * beat); t += b * beat; });
    this.timer = setTimeout(() => this.loop(), (t - this.ac.currentTime + 4) * 1000);
  },
  start() {
    if (!CFG.MUSIC) return;
    this.init(); if (!this.ac) return;
    if (this.ac.state === 'suspended') this.ac.resume();
    this.started = true; clearTimeout(this.timer); if (this.on) this.loop();
  },
  toggle() {
    this.on = !this.on;
    if (!this.ac) { this.init(); }
    if (!this.ac) return this.on;
    clearTimeout(this.timer);
    if (this.on) { this.master.gain.value = .55; if (this.ac.state === 'suspended') this.ac.resume(); this.loop(); }
    else { this.master.gain.setTargetAtTime(0, this.ac.currentTime, .05); }
    return this.on;
  }
};

let state = 'closed', at = 0, ot = 0, ct = 0, phase = 0, lastPhase = 0;

  el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
}

function applyTheme(i, announce) {

  orbiters.forEach(o => o.col = pick(T.pal)); floaters.forEach(f => f.col = pick(T.pal)); balloons.forEach(b => b.col = pick(T.pal));

/* ---------------------------------------------------------------------
   Vẽ từng khung hình
   --------------------------------------------------------------------- */
function drawBackground(hk, kick) {
  const c = bg;
  c.setTransform(bgCv.width / W, 0, 0, bgCv.height / H, 0, 0);
  c.globalCompositeOperation = 'source-over';
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(T.top)); g.addColorStop(1, rgb(T.bot));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  const M = Math.max(W, H);
  for (const b of blobs) {
    const x = (b.x + Math.sin(at * b.sx + b.p) * b.ax) * W, y = (b.y + Math.cos(at * b.sy + b.p) * b.ay) * H, r = b.r * M;
    const a = b.l * (.75 + .25 * Math.sin(at * b.sl + b.p)) + .05 * kick;
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rgba(T.blobs[b.ci], a)); rg.addColorStop(1, rgba(T.blobs[b.ci], 0));
    c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (state === 'closed') {                                   // quầng sáng phía sau tấm thiệp
    const rg = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, cardPH * .95);
    rg.addColorStop(0, rgba(T.hot, .30 + .06 * Math.sin(at * 2))); rg.addColorStop(1, rgba(T.hot, 0));
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
  }
  if (hk > .02) {
    const L = M * 1.1, rc = T.ray;
    const rg = c.createRadialGradient(cx, cy, 0, cx, cy, L);
    const ra = (.35 + .8 * kick) * hk;
    rg.addColorStop(0, `rgba(${rc[0] * 2},${rc[1] * 2},${rc[2] * 2},${.40 * ra})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = rg;
    for (let i = 0; i < 9; i++) {
      const a = at * .07 + i * TAU / 9, w = .075;
      c.beginPath(); c.moveTo(cx, cy);
      c.lineTo(cx + Math.cos(a - w) * L, cy + Math.sin(a - w) * L); c.lineTo(cx + Math.cos(a + w) * L, cy + Math.sin(a + w) * L);
      c.closePath(); c.fill();
    }
    const halo = c.createRadialGradient(cx, cy, 0, cx, cy, S * 22);
    halo.addColorStop(0, rgba(T.hot, (.30 + .30 * kick) * hk)); halo.addColorStop(1, rgba(T.hot, 0));
    c.fillStyle = halo; c.fillRect(cx - S * 22, cy - S * 22, S * 44, S * 44);
  }
  const sp = (at % 7) / 7;                                     // vệt sáng bóng loáng lướt chéo
  if (sp < .6) {
    const q = sp / .6, br = Math.pow(Math.max(0, Math.sin(q * Math.PI)), 1.5) * .16;
    c.save(); c.translate(-W * .3 + q * W * 1.6, 0); c.rotate(-.42);
    const bw = W * .16, bgr = c.createLinearGradient(-bw, 0, bw, 0);
    bgr.addColorStop(0, 'rgba(255,255,255,0)'); bgr.addColorStop(.5, `rgba(255,236,250,${br})`); bgr.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = bgr; c.fillRect(-bw, -H * .5, bw * 2, H * 2); c.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bgCv, 0, 0, W, H);
}

function drawAmbient(dt) {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) glow(s.x, s.y, s.r, T.core, .15 + .6 * (.5 + .5 * Math.sin(at * s.f + s.ph)));
  for (const b of bokeh) {
    b.y -= b.v * dt; if (b.y < -70) { b.y = H + 70; b.x = rand(0, W); }
    glow(b.x + Math.sin(at * .2 + b.ph) * 20, b.y, b.r, [T.hot, T.violet, T.rose][b.ci], .10 + .05 * Math.sin(at * .7 + b.ph));
  }
  for (const g of glitter) {
    g.y += g.vy * dt; if (g.y > H + 10) { g.y = -10; g.x = rand(0, W); }
    glow(g.x + Math.sin(at * .6 + g.ph) * 14, g.y, g.r + 1, [T.core, T.gold, T.rose][g.ci], .15 + .85 * Math.pow(Math.max(0, Math.sin(at * g.f + g.ph)), 2));
  }
}

function drawFlares(mode) {
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flares) {
    const ph = at * f.f + f.ph, cyc = Math.floor(ph / TAU);
    if (cyc !== f.cyc) {
      f.cyc = cyc;
      if (mode === 'celebrate') {
        if (Math.random() < .7) { const ang = rand(0, TAU), rr = Math.pow(rand(.2, 1), .6); f.x = cx + Math.cos(ang) * rr * 20 * S; f.y = cy + Math.sin(ang) * rr * 17 * S; }
        else { f.x = rand(0, W); f.y = rand(0, H * .8); }
      } else { f.x = W / 2 + rand(-cardPW * .75, cardPW * .75); f.y = H / 2 + rand(-cardPH * .62, cardPH * .62); }
    }
    const lv = Math.round(Math.pow(Math.max(0, Math.sin(ph)), 3) * 8);
    if (lv > 0) ctx.drawImage(flareSprite(f.size, lv), f.x - f.size - 1, f.y - f.size - 1, f.size * 2 + 2, f.size * 2 + 2);
  }
}

function drawHeart(scale, hk, kick) {
  // thân tim: chuyển màu mượt từ tâm sáng (góc trên trái) ra viền đậm
  ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * cx, DPR * cy);
  const bodyG = ctx.createRadialGradient(-5, -6.5, 0, -2, -2, 27);
  bodyG.addColorStop(0, rgba(lerpC(T.rose, T.core, .72), .95));
  bodyG.addColorStop(.26, rgba(lerpC(T.rose, T.core, .2), .93));
  bodyG.addColorStop(.6, rgba(T.hot, .92));
  bodyG.addColorStop(1, rgba(lerpC(T.hot, [110, 0, 70], .45), .92));
  ctx.fillStyle = bodyG; ctx.fill(UNIT_PATH);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // hạt sáng
  ctx.globalCompositeOperation = 'lighter';
  const step = quality < .7 ? 2 : 1, rk = clamp(scale / 11.4, .55, 1.3);
  for (let i = 0; i < dots.length; i += step) {
    const d = dots[i];
    const k = BEAT[Math.floor((((phase - d.r * .18) % 1) + 1) % 1 * BEAT_N) % BEAT_N];
    const s = scale * (1 + .10 * k);
    const x = cx + d.bx * s + Math.sin(at * d.f + d.ph) * d.wob, y = cy + d.by * s + Math.cos(at * d.f * .9 + d.ph) * d.wob;
    const lv = (.26 + .44 * (.5 + .5 * Math.sin(at * d.tw + d.ph * 1.7)) + .34 * k) * hk;
    glow(x, y, d.rad * 6.6 * rk * (step === 2 ? 1.3 : 1), d.col, lv);
  }
  // viền neon
  const pts = [];
  const og = Math.round(13 * rk);
  for (let i = 0; i < OUT_N; i++) {
    const [hx, hy] = OUTLINE[i], x = cx + hx * scale, y = cy + hy * scale;
    if (i % 2 === 0) pts.push([x, y]);
    if (quality > .6 || i % 2 === 0) glow(x, y, og, T.hot, (.50 + .30 * Math.sin(at * 2.2 - i * .09) + .35 * kick) * .75 * hk);
  }
  const head0 = (at * 42 * OUT_N / 280) % OUT_N;
  for (const head of [head0, (head0 + OUT_N / 2) % OUT_N]) {
    for (let t = 0; t < 14; t++) {
      const i = ((Math.floor(head - t) % OUT_N) + OUT_N) % OUT_N, [hx, hy] = OUTLINE[i];
      glow(cx + hx * scale, cy + hy * scale, Math.round((34 - t * 2) * rk), T.core, (1 - t / 14) * .9 * hk);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = rgb(T.core); ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke();
  // vệt bóng như ngọc
  ctx.globalCompositeOperation = 'lighter';
  GLOSS.forEach((p, i) => {
    const edge = 1 - Math.pow(Math.abs(i / Math.max(1, GLOSS.length - 1) * 2 - 1), 2);
    glow(cx + p[0] * scale, cy + p[1] * scale, Math.round(11 * rk), [255, 255, 255], (.25 + .35 * kick) * edge);
  });
}

function drawRings(dt, scale) {
  if (!rings.length) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 3;
  for (let i = 0; i < rings.length; i++) {
    rings[i] += dt; const a = rings[i], k = Math.pow(1 - a / 1.3, 2);
    if (k <= 0) continue;
    const sc = scale * (1 + a * .9);
    ctx.strokeStyle = rgba(T.rose, .75 * k); ctx.beginPath();
    for (let j = 0; j < OUT_N; j += 3) { const p = OUTLINE[j]; j ? ctx.lineTo(cx + p[0] * sc, cy + p[1] * sc) : ctx.moveTo(cx + p[0] * sc, cy + p[1] * sc); }
    ctx.closePath(); ctx.stroke();
  }
  for (let i = rings.length - 1; i >= 0; i--) if (rings[i] >= 1.3) rings.splice(i, 1);
}

function drawParticles(dt, celebrating, scale, hk) {
  // tim nhỏ bật ra
  for (let i = poppers.length - 1; i >= 0; i--) {
    const p = poppers[i]; p.life -= dt;
    if (p.life <= 0) { poppers.splice(i, 1); continue; }
    const f = Math.pow(.99, dt * 60); p.vx *= f; p.vy = p.vy * f - 6 * dt;
    p.x += p.vx * dt + Math.sin(at * 2 + p.ph) * .5; p.y += p.vy * dt;
    const fade = Math.min(1, p.life / p.max * 3) * Math.min(1, (p.max - p.life) * 4);
    ctx.globalCompositeOperation = 'lighter'; glow(p.x, p.y, p.size * 2, p.col, .55 * fade);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = .96 * fade;
    const im = heartSprite(Math.round(p.size), p.col), d = im.width / DPR;
    ctx.drawImage(im, p.x - d / 2, p.y - d / 2, d, d); ctx.globalAlpha = 1;
  }
  // tim nhỏ bay vòng quanh
  if (celebrating && scale > 3) {
    for (const o of orbiters) {
      const a = o.a0 + at * o.sp, ex = Math.cos(a) * o.rx, ey = Math.sin(a) * o.ry, c = Math.cos(o.tilt), s = Math.sin(o.tilt);
      const x = cx + ex * c - ey * s, y = cy + ex * s + ey * c + Math.sin(at * 1.3 + o.bob) * 8, depth = Math.sin(a);
      const sz = Math.max(6, Math.round(o.size * (.78 + .22 * depth))), fade = (.62 + .38 * depth) * hk;
      ctx.globalCompositeOperation = 'lighter'; glow(x, y, sz * 2.2, o.col, .5 * fade);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = .94 * fade;
      const im = heartSprite(sz, o.col), d = im.width / DPR; ctx.drawImage(im, x - d / 2, y - d / 2, d, d); ctx.globalAlpha = 1;
      if (Math.random() < .3) embers.push({ x, y, vx: rand(-15, 15), vy: rand(-15, 15), life: rand(.6, 1.2), max: 1.2, rad: 2, col: o.col, drag: .95, grav: 0 });
    }
    for (let k = 0; k < 2; k++) {
      const [hx, hy] = pick(OUTLINE), mag = Math.hypot(hx, hy) || 1, life = rand(1.6, 3.2);
      embers.push({ x: cx + hx * scale, y: cy + hy * scale, vx: hx / mag * rand(12, 50), vy: hy / mag * rand(12, 50) - rand(8, 35),
                    life, max: life, rad: pick([2, 3, 3, 4]), col: pick(T.pal), drag: .985, grav: -8 });
    }
  }
  // tàn sáng / pháo hoa
  ctx.globalCompositeOperation = 'lighter';
  for (let i = embers.length - 1; i >= 0; i--) {
    const m = embers[i]; m.life -= dt;
    if (m.life <= 0) { embers.splice(i, 1); continue; }
    const f = Math.pow(m.drag, dt * 60); m.vx *= f; m.vy = m.vy * f + m.grav * dt; m.x += m.vx * dt; m.y += m.vy * dt;
    glow(m.x, m.y, m.rad + 1, m.col, Math.pow(m.life / m.max, .8));
  }
  if (embers.length > cnt.embers) embers.splice(0, embers.length - cnt.embers);
}

function drawFloaters(dt) {
  for (const h of floaters) {
    h.y -= h.v * dt; h.x = h.x0 + Math.sin(at * h.f + h.ph) * h.sw;
    if (h.y < -50) Object.assign(h, makeFloater(false));
    const fade = clamp((h.y + 40) / 160) * clamp((H + 60 - h.y) / 120);
    ctx.globalCompositeOperation = 'lighter'; glow(h.x, h.y, h.size * 1.9, h.col, .45 * fade);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = h.a * fade;
    const im = heartSprite(Math.round(h.size), h.col), d = im.width / DPR; ctx.drawImage(im, h.x - d / 2, h.y - d / 2, d, d); ctx.globalAlpha = 1;
  }
}

function drawBalloons(dt) {
  for (const b of balloons) {
    b.y -= b.v * dt; const x = b.x0 + Math.sin(at * b.f + b.ph) * b.sw;
    if (b.y < -220) Object.assign(b, makeBalloon(false));
    const spr = balloonSprite(b.col), w = spr.width / DPR / 1.5 * b.k * 1.5 / 1.5, h = spr.height / DPR * b.k;
    ctx.globalCompositeOperation = 'lighter'; glow(x, b.y + 20 * b.k, 52 * b.k, b.col, .22);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(spr, x - (spr.width / (DPR * 1.5)) * b.k / 2, b.y - 40 * b.k, (spr.width / (DPR * 1.5)) * b.k, (spr.height / (DPR * 1.5)) * b.k);
  }
}

/* ---------------------------------------------------------------------
   Vòng lặp chính
   --------------------------------------------------------------------- */
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsClock = 0;
function frame(now) {
  try { step(now); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function step(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; at += dt;
  // tự điều chỉnh chất lượng theo tốc độ khung hình
  fpsAcc += dt; fpsN++; fpsClock += dt;
  if (fpsClock > 2) { const fps = fpsN / fpsAcc; quality = fps < 38 ? Math.max(.45, quality - .2) : fps > 56 ? Math.min(1, quality + .1) : quality; fpsAcc = fpsN = fpsClock = 0; }

  phase = (at * CFG.BPM / 60) % 1;
  const kick = beatAt(phase), newBeat = phase < lastPhase; lastPhase = phase;

  if (state === 'opening') {
    ot += dt;
    if (ot > 1.25 && !burst1) { burst1 = true; heartsBurst(W / 2, H / 2, 18); firework(W * .2, H * .32, 46); firework(W * .8, H * .3, 46); }
    if (ot > 3.4) startCelebrate();
  } else if (state === 'celebrate') ct += dt;

  const celebrating = state === 'celebrate';
  const hk = celebrating ? easeOut((ct - .15) / 1) : 0;
  const pop = celebrating ? easeOutBack((ct - .1) / 1.3) : 0;
  const scale = S * pop * (1 + .075 * kick) + (pop > .5 ? Math.sin(at * 1.3) * .15 : 0);

  if (celebrating) {
    if (!burst2 && ct > .35) {
      burst2 = true; heartsBurst(cx, cy, 26);
      for (let i = 0; i < 4; i++) firework(rand(W * .12, W * .88), rand(H * .1, H * .38), 56);
    }
    if (ct > .6) bannerEl.classList.add('show');
    if (ct > .95) nameBox.classList.add('show');
    if (newBeat && scale > 3) { rings.push(0); beatBurst(scale); }
    fireTimer -= dt;
    if (ct > 1.2 && fireTimer <= 0 && !reduceMotion) { fireTimer = rand(1.3, 2.4); firework(rand(W * .1, W * .9), rand(H * .08, H * .5), 60); }
    if (ct > 5.2 && !wishStarted) { showWish(0); }
    if (wishStarted) { wishClock += dt; if (wishClock > CFG.WISH_SECONDS) showWish(wishIdx + 1); }
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(hk, kick);
  drawAmbient(dt);
  if (celebrating) drawBalloons(dt);
  if (celebrating && scale > .6) { drawHeart(scale, hk, kick); drawRings(dt, scale); }
  drawFlares(celebrating ? 'celebrate' : 'card');
  drawFloaters(dt);
  drawParticles(dt, celebrating, scale, hk);
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------------------------------------------------------------
   Tương tác
   --------------------------------------------------------------------- */
let downX = 0, downY = 0, downT = 0;
document.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
document.addEventListener('pointerup', (e) => {
  if (e.target.closest && e.target.closest('#ui')) return;
  const dx = e.clientX - downX, dy = e.clientY - downY;
  if (state === 'closed') { openCard(); return; }
  if (state !== 'celebrate') return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { showWish(wishIdx + (dx < 0 ? 1 : -1)); return; }
  if (e.clientY > wishTop - 10 && wishStarted) { showWish(wishIdx + 1); return; }
  firework(e.clientX, e.clientY, 54); heartsBurst(e.clientX, e.clientY, 8);
});
document.addEventListener('pointermove', (e) => {
  if (state !== 'closed' || e.pointerType === 'touch') return;
  const rx = ((e.clientY / H) - .5) * -10, ry = ((e.clientX / W) - .5) * 14;
  tilt.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
});
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (state === 'closed') openCard(); else if (state === 'celebrate') showWish(wishIdx + 1); }
  else if (e.key === 'ArrowRight' && state === 'celebrate') showWish(wishIdx + 1);
  else if (e.key === 'ArrowLeft' && state === 'celebrate') showWish(wishIdx - 1);
});
$('btnTheme').addEventListener('click', () => applyTheme(themeIdx + 1, true));
$('btnSound').addEventListener('click', () => {
  const on = Music.toggle(); toast(on ? 'Đã bật nhạc' : 'Đã tắt nhạc');
  $('icoSound').innerHTML = on ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'
                               : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>';
});
$('btnReplay').addEventListener('click', () => { clearTimeout(Music.timer); closeCard(); });
window.addEventListener('resize', () => { resize(); buildEntities(); applyTheme(themeIdx, false); });
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); buildEntities(); applyTheme(themeIdx, false); }, 250));

/* ---------------------------------------------------------------------
   Khởi động
   --------------------------------------------------------------------- */
buildCards();
buildDots();
bannerEl.textContent = CFG.TITLE[0];
nameBox.querySelector('.n1').textContent = CFG.TITLE[1];
nameBox.querySelector('.n2').textContent = CFG.TITLE[2];
resize();
buildEntities();
applyTheme(themeIdx, false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
window.__card = { get state() { return state; }, get ct() { return ct; }, get quality() { return quality; }, openCard, closeCard, showWish, firework };
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
